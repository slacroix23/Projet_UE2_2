<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chat – Trust The Roll</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>

<body>

    <!-- ---------------------------------------------------------
         🏛️ HEADER VEGAS NÉON
    --------------------------------------------------------- -->
    <header class="casino-header">
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" />
        </div>

        <div class="bandeau">Chat Secret</div>

        <div class="user-info">
            <span class="username">{{ session.username }}</span>
            <span class="balance">Balance :
                <span id="balance-value">{{ balance }}</span> €
            </span>
        </div>
    </header>

    <!-- ---------------------------------------------------------
         💬 CHAT
    --------------------------------------------------------- -->
    <div id="chat-container">
        <div id="messages"></div>

        <div id="input-zone">
            <input type="text" id="message-input" placeholder="Message secret...">
            <button id="send-btn">Envoyer</button>
        </div>
    </div>

    <!-- ---------------------------------------------------------
         ✨ PARTICULES
    --------------------------------------------------------- -->
    <canvas id="particles"></canvas>

    <!-- ---------------------------------------------------------
         🔌 SOCKET.IO
    --------------------------------------------------------- -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const socket = io();
            const messageContainer = document.getElementById('messages');
            const input = document.getElementById('message-input');
            const btn = document.getElementById('send-btn');

            socket.on('new_message', (data) => {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add("msg");
                msgDiv.innerHTML = `<strong>${data.user}:</strong> ${data.payload}`;
                messageContainer.appendChild(msgDiv);
                messageContainer.scrollTop = messageContainer.scrollHeight;
            });

            btn.addEventListener('click', () => {
                const texte = input.value;
                if (texte.trim() !== "") {
                    socket.emit('send_message', { payload: texte });
                    input.value = "";
                }
            });

            input.addEventListener("keypress", (e) => {
                if (e.key === "Enter") btn.click();
            });
        });
    </script>

    <!-- ---------------------------------------------------------
         ✨ SCRIPT PARTICULES
    --------------------------------------------------------- -->
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById("particles");
            const ctx = canvas.getContext("2d");

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener("resize", resize);

            const particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.3 + 0.1,
                    alpha: Math.random() * 0.5 + 0.3
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 215, 100, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();

                    p.y -= p.speed;
                    if (p.y < -5) {
                        p.y = canvas.height + 5;
                        p.x = Math.random() * canvas.width;
                    }
                });

                requestAnimationFrame(animate);
            }
            animate();
        });
    </script>

</body>
</html>
