<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='blackjack.css') }}">
    <title>Blackjack Premium</title>
</head>
<body>
    <header class="casino-header">
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" />
        </div>
        <div class="bandeau">Blackjack</div>
    </header>

    <main id="game-container">
        <div class="table">
            <div class="dealer-area">
                <h3>Croupier : <span id="dealer-score">?</span></h3>
                <div id="dealer-cards" class="hand"></div>
            </div>

            <div id="status-message"></div>

            <div class="player-area">
                <h3>Votre Main : <span id="player-score">0</span></h3>
                <div id="player-cards" class="hand"></div>
            </div>
        </div>

        <div class="controls">
            <button id="btn-start">Nouvelle Partie</button>
            <button id="btn-hit" disabled>Tirer</button>
            <button id="btn-stand" disabled>S'arrêter</button>
        </div>
    </main>

    <canvas id="particles"></canvas>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // --- 1. ANIMATION PARTICULES ---
            const canvas = document.getElementById("particles");
            const ctx = canvas.getContext("2d");
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resize();
            window.addEventListener("resize", resize);
            
            const particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.3 + 0.1,
                    alpha: Math.random() * 0.5 + 0.3
                });
            }
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 215, 100, ${p.alpha})`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    p.y -= p.speed;
                    if (p.y < -5) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
                });
                requestAnimationFrame(animate);
            }
            animate();

            // --- 2. LOGIQUE DU JEU ---
            let currentGameId = null;

            function getCardHTML(cardCode) {
                if (!cardCode) return '';
                const symbols = { 'H': '♥', 'D': '♦', 'C': '♣', 'S': '♠' };
                const rank = cardCode.slice(0, -1);
                const suitLetter = cardCode.slice(-1);
                const symbol = symbols[suitLetter] || suitLetter;
                const isRed = suitLetter === 'H' || suitLetter === 'D';
                return `<div class="card-visual ${isRed ? 'card-red' : ''}">${rank}<br>${symbol}</div>`;
            }

            function updateUI(data) {
                if (data.player_hand) {
                    document.getElementById('player-cards').innerHTML = data.player_hand.map(c => getCardHTML(c)).join('');
                    document.getElementById('player-score').innerText = data.player_score;
                }
                if (data.dealer_visible_card && !data.result) {
                    document.getElementById('dealer-cards').innerHTML = getCardHTML(data.dealer_visible_card) + `<div class="card-visual back">?</div>`;
                }
                if (data.result) {
                    document.getElementById('status-message').innerText = data.result;
                    document.getElementById('dealer-cards').innerHTML = data.dealer_hand.map(c => getCardHTML(c)).join('');
                    document.getElementById('dealer-score').innerText = data.dealer_score;
                    toggleButtons(false);
                }
            }

            function toggleButtons(isPlaying) {
                document.getElementById('btn-start').disabled = isPlaying;
                document.getElementById('btn-hit').disabled = !isPlaying;
                document.getElementById('btn-stand').disabled = !isPlaying;
            }

            // --- 3. ÉVÉNEMENTS (Placés à l'intérieur du DOMContentLoaded) ---
            document.getElementById('btn-start').addEventListener('click', async () => {
                try {
                    const response = await fetch('/start', { method: 'POST' });
                    const data = await response.json();
                    currentGameId = data.game_id;
                    document.getElementById('status-message').innerText = "";
                    document.getElementById('dealer-score').innerText = "?";
                    updateUI(data);
                    toggleButtons(true);
                } catch (e) { console.error("Erreur Start:", e); }
            });

            document.getElementById('btn-hit').addEventListener('click', async () => {
                if (!currentGameId) return;
                const response = await fetch(`/game/${currentGameId}/hit`, { method: 'POST' });
                const data = await response.json();
                updateUI(data);
                if (data.status === "Bust!") {
                    document.getElementById('status-message').innerText = "Bust ! Vous avez perdu.";
                    toggleButtons(false);
                }
            });

            document.getElementById('btn-stand').addEventListener('click', async () => {
                if (!currentGameId) return;
                const response = await fetch(`/game/${currentGameId}/stand`, { method: 'POST' });
                const data = await response.json();
                updateUI(data);
            });
        });
    </script>
</body>
</html>
