<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='blackjack.css') }}">
    <title>Blackjack Premium</title>
</head>
<body>
    <header class="casino-header">
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" />
        </div>
        <div class="bandeau">Blackjack</div>
        <div class="user-info"> 
            <span class="username">{{ session.username }}</span> 
            <span class="balance">Balance : <span id="balance-value">{{ balance }}</span> €</span> 
        </div>
    </header>

<main id="game-container">
    <div class="table">
        <div class="dealer-area">
            <h3>Croupier : <span id="dealer-score">?</span></h3>
            <div id="dealer-cards" class="hand"></div>
        </div>

        <div id="status-message"></div>

        <div class="player-area">
            <h3>Votre Main : <span id="player-score">0</span></h3>
            <div id="player-cards" class="hand"></div>
        </div>
    </div>

    <div class="controls">
        <div class="bet-container">
            <label for="bet-amount" class="bet-label">Mise :</label>
            <input type="number" id="bet-amount" value="10" min="1">
        </div>
        
        <button id="btn-start">Nouvelle Partie</button>
        <button id="btn-hit" disabled>Tirer</button>
        <button id="btn-stand" disabled>S'arrêter</button>
    </div>
</main>
<footer>
    <a href="{{ url_for('choix') }}" class="retour">Retour au choix des jeux</a>
</footer>

    <canvas id="particles"></canvas>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // --- 1. ANIMATION PARTICULES ---
            const canvas = document.getElementById("particles");
            const ctx = canvas.getContext("2d");
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resize();
            window.addEventListener("resize", resize);
            
            const particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.3 + 0.1,
                    alpha: Math.random() * 0.5 + 0.3
                });
            }
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 215, 100, ${p.alpha})`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    p.y -= p.speed;
                    if (p.y < -5) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
                });
                requestAnimationFrame(animate);
            }
            animate();

            let currentGameId = null;

        function getCardHTML(cardCode) {
            if (!cardCode) return '';
            const symbols = { 'H': '♥', 'D': '♦', 'C': '♣', 'S': '♠' };
            const rank = cardCode.slice(0, -1);
            const suitLetter = cardCode.slice(-1);
            const symbol = symbols[suitLetter] || suitLetter;
            const isRed = suitLetter === 'H' || suitLetter === 'D';
            return `<div class="card-visual ${isRed ? 'card-red' : ''}">${rank}<br>${symbol}</div>`;
        }

        function updateUI(data) {
            // Mise à jour de la main du joueur
            if (data.player_hand) {
                document.getElementById('player-cards').innerHTML = data.player_hand.map(c => getCardHTML(c)).join('');
                document.getElementById('player-score').innerText = data.player_score;
            }
            // Affichage initial du croupier (une carte cachée)
            if (data.dealer_visible_card && !data.result) {
                document.getElementById('dealer-cards').innerHTML = getCardHTML(data.dealer_visible_card) + `<div class="card-visual back">?</div>`;
            }
            // Résultat final
            if (data.result) {
                let message = `${data.result}`;
                if (data.gain > 0) {
                    message += ` Vous gagnez ${data.gain} jetons !`;
                } else if (data.result === "Perdu !") {
                    message += ` Vous avez perdu votre mise.`;
                }
                
                document.getElementById('status-message').innerText = message;
                document.getElementById('dealer-cards').innerHTML = data.dealer_hand.map(c => getCardHTML(c)).join('');
                document.getElementById('dealer-score').innerText = data.dealer_score;
                toggleButtons(false);
            }
        }

        function toggleButtons(isPlaying) {
            document.getElementById('btn-start').disabled = isPlaying;
            document.getElementById('bet-amount').disabled = isPlaying;
            document.getElementById('btn-hit').disabled = !isPlaying;
            document.getElementById('btn-stand').disabled = !isPlaying;
        }

        // --- 3. ÉVÉNEMENTS ---
        document.getElementById('btn-start').addEventListener('click', async () => {
            const mise = document.getElementById('bet-amount').value;
            
            try {
                const response = await fetch('/start', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bet: mise }) // Envoi de la mise au Python
                });
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                    return;
                }

                currentGameId = data.game_id;
                document.getElementById('status-message').innerText = "";
                document.getElementById('status-message').className = "";
                document.getElementById('dealer-score').innerText = "?";
                updateUI(data);
                toggleButtons(true);
            } catch (e) { console.error("Erreur Start:", e); }
        });

        document.getElementById('btn-hit').addEventListener('click', async () => {
            if (!currentGameId) return;
            const response = await fetch(`/game/${currentGameId}/hit`, { method: 'POST' });
            const data = await response.json();
            updateUI(data);
            if (data.status === "Bust!") {
                document.getElementById('status-message').innerText = "Bust ! Vous avez dépassé 21.";
                toggleButtons(false);
            }
        });

        document.getElementById('btn-stand').addEventListener('click', async () => {
            if (!currentGameId) return;
            const response = await fetch(`/game/${currentGameId}/stand`, { method: 'POST' });
            const data = await response.json();
            updateUI(data);
        });
    });
</script>

<script>
    async function autoUpdateBalance() {
        try {
            const res = await fetch("/api/balance");
            const data = await res.json();

            const span = document.getElementById("balance-value");
            if (!span) return;

            const oldValue = span.textContent;

            // Si la balance change → animation
            if (oldValue !== String(data.balance)) {
                span.textContent = data.balance;

                // Ajoute la classe d’animation
                span.parentElement.classList.add("updated");

                // La retire après l’animation
                setTimeout(() => {
                    span.parentElement.classList.remove("updated");
                }, 600);
            }

        } catch (e) {
            console.error("Erreur balance :", e);
        }
    }

    // Mise à jour au chargement
    document.addEventListener("DOMContentLoaded", autoUpdateBalance);

    // Mise à jour automatique toutes les 2 secondes
    setInterval(autoUpdateBalance, 2000);
</script>
