<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Choix du jeu</title>
    <link rel="stylesheet" href="../static/choix.css">
</head>

<body>
    <header class="casino-header">
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" />
        </div>
        <div class="bandeau">Choisissez votre Jeu !!</div>
    </header>

    <main class="games-container">
        <a href="{{ url_for('blackjack') }}" class="game-link">
            <div class="game-card">
                <img src="../static/blackjack.png" class="game-image">
                <p>Maîtrisez l'art du 21</p>
            </div>
        </a>
        <a href="{{ url_for('roulette') }}" class="game-link">
            <div class="game-card">
            <img src="../static/roulette.png" class="game-image">
            <p>Faites vos jeux, rien ne va plus !</p>
        </div>
    </main>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById("particles");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener("resize", resize);

            const particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.3 + 0.1,
                    alpha: Math.random() * 0.5 + 0.3
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 215, 100, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();

                    p.y -= p.speed;
                    if (p.y < -5) {
                        p.y = canvas.height + 5;
                        p.x = Math.random() * canvas.width;
                    }
                });

                requestAnimationFrame(animate);
            }
            animate();
        });
        </script>

    <canvas id="particles"></canvas>
</body>

</html>
