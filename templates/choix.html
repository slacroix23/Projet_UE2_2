<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Choix du jeu</title>
    <link rel="stylesheet" href="../static/choix.css">
</head>

<body>
    <header class="casino-header">
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" />
        </div>
        <div class="bandeau">Choisissez votre Jeu !!</div>
        <div class="user-info">
            <span class="username">{{ session.username }}</span>
            <span class="balance">Balance : <span id="balance-value">{{ balance }}</span> €</span>
        </div>
    </header>

    <link rel="stylesheet" href="{{ url_for('static', filename='choix.css') }}">

    <div class="game-card">
        <img src="{{ url_for('static', filename='blackjack.png') }}" class="game-image">
        <p>Maîtrisez l'art du 21</p>
    </div>

    <div class="game-card">
        <img src="{{ url_for('static', filename='roulette.png') }}" class="game-image">
        <p>Faites vos jeux, rien ne va plus !</p>
    </div>
    </main>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById("particles");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener("resize", resize);

            const particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.3 + 0.1,
                    alpha: Math.random() * 0.5 + 0.3
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 215, 100, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();

                    p.y -= p.speed;
                    if (p.y < -5) {
                        p.y = canvas.height + 5;
                        p.x = Math.random() * canvas.width;
                    }
                });

                requestAnimationFrame(animate);
            }
            animate();
        });
    </script>
    <script>
        async function autoUpdateBalance() {
            try {
                const res = await fetch("/api/balance");
                const data = await res.json();

                const span = document.getElementById("balance-value");
                if (!span) return;

                const oldValue = span.textContent;

                // Si la balance change → animation
                if (oldValue !== String(data.balance)) {
                    span.textContent = data.balance;

                    // Ajoute la classe d’animation
                    span.parentElement.classList.add("updated");

                    // La retire après l’animation
                    setTimeout(() => {
                        span.parentElement.classList.remove("updated");
                    }, 600);
                }

            } catch (e) {
                console.error("Erreur balance :", e);
            }
        }

        // Mise à jour au chargement
        document.addEventListener("DOMContentLoaded", autoUpdateBalance);

        // Mise à jour automatique toutes les 2 secondes
        setInterval(autoUpdateBalance, 2000);
    </script>

    <canvas id="particles"></canvas>
</body>

</html>
